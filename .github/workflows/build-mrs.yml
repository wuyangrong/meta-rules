name: Build MRS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - geo/geosite/dary.txt
      - .github/workflows/build-mrs.yml

permissions:
  contents: write

concurrency:
  group: build-mrs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download mihomo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tools
          gh release download \
            --repo MetaCubeX/mihomo \
            --pattern 'mihomo-linux-amd64-v1-v*.gz' \
            --dir .tools

          ASSET="$(find .tools -name 'mihomo-linux-amd64-v1-v*.gz' -print -quit)"
          test -n "$ASSET"

          gzip -dc "$ASSET" > .tools/mihomo
          chmod +x .tools/mihomo
          .tools/mihomo -v

      - name: Convert domain text to mrs
        run: |
          mkdir -p build/geosite dist/geosite

          awk '
            {
              sub(/\r$/, "")
              sub(/[[:space:]]+#.*/, "")
              gsub(/^[[:space:]]+|[[:space:]]+$/, "")
            }
            $0 != "" && $0 !~ /^#/ { print }
          ' geo/geosite/dary.txt | LC_ALL=C sort -u > build/geosite/dary.txt

          test -s build/geosite/dary.txt
          .tools/mihomo convert-ruleset domain text build/geosite/dary.txt dist/geosite/dary.mrs
          test -s dist/geosite/dary.mrs

      - name: Commit generated mrs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dist/geosite/dary.mrs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "build: update dary geosite mrs"
            git push
          fi
